# CI: fmt / clippy / テスト、および .sqlx（オフラインクエリデータ）の陳腐化検出。
# PostgreSQL 17 をサービスとして立て、マイグレーションを当ててから
# `cargo sqlx prepare --check` で .sqlx がコード中の query! と一致することを確認する。
# DB を使うテスト（#[sqlx::test]）はテストごとに DB とアプリ用ロールを作るので、
# DATABASE_URL はアプリ用。sqlx::test の隔離 DB 作成だけ TEST_ADMIN_DATABASE_URL を使う。
# 実際のリポジトリ操作は各テストで assay_app に接続し直す。
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: unite
          POSTGRES_PASSWORD: unite_dev
          POSTGRES_DB: unite_matchsystem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unite -d unite_matchsystem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://assay_app:assay_app_test@localhost:5432/unite_matchsystem
      MIGRATOR_DATABASE_URL: postgres://assay_migrator:migrator_ci@localhost:5432/unite_matchsystem
      TEST_ADMIN_DATABASE_URL: postgres://unite:unite_dev@localhost:5432/unite_matchsystem
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Apply migrations
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role assay_migrator login password 'migrator_ci' nosuperuser nocreatedb nocreaterole noreplication nobypassrls;
          create role assay_app login password 'assay_app_test' nosuperuser nocreatedb nocreaterole noreplication nobypassrls;
          alter database unite_matchsystem owner to assay_migrator;
          alter schema public owner to assay_migrator;
          revoke all on schema public from public;
          SQL
          DATABASE_URL="$MIGRATOR_DATABASE_URL" sqlx migrate run
          psql "$MIGRATOR_DATABASE_URL" -f ops/app_role.sql
          psql "$DATABASE_URL" -f ops/verify_app_role.sql
          violations=$(psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -f ops/check_app_role.sql)
          test -z "$violations" || { printf '%s\n' "$violations"; exit 1; }
      - name: Format
        run: cargo fmt --check
      - name: Offline query data is current
        run: cargo sqlx prepare --check -- --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test --lib --bin unite-matchsystem --test lifecycle
          cargo test --doc
      - name: Isolated database tests (bootstrap only uses admin)
        run: DATABASE_URL="$TEST_ADMIN_DATABASE_URL" cargo test --test persistence --test discord --test schema
