[package]
name = "unite-matchsystem"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
# 署名付き Cookie（SignedCookieJar）。セッションストアを立てない方針（05 §1）。
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
# Discord OAuth2 のトークン交換と /users/@me。TLS は serenity と同じ rustls に揃える。
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
# Discord アダプタ（Phase 4）。ゲートウェイはインタラクションを受けるためだけに使い、
# メッセージ本文は読まない（MESSAGE_CONTENT の特権インテントは不要）。
# cache / framework / standard_framework は使わないので外す。
serenity = { version = "0.12.5", default-features = false, features = ["builder", "client", "gateway", "model", "http", "rustls_backend"] }
# TLS なし（意図的）: PostgreSQL はアプリと同一ホスト（localhost / Unix socket）で動かす前提。
# マネージド PostgreSQL 等のリモート DB に移すときは "tls-rustls-ring" を feature に足して再ビルドする。
# 設定値では切り替えられないので、移行時の作業項目として扱うこと。
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2.0.20"
# Cookie の Max-Age。axum-extra が使う cookie クレートと同じ time の型を組み立てるため。
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
